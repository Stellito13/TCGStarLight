<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page introuvable · StarLight TCG</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>

        .page-404 {
            min-height: calc(100vh - 68px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 5% 60px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        
            20%  { opacity: 0.25; }
            50%  { opacity: 0.12; transform: translateY(-20px) rotate(22deg); }
            80%  { opacity: 0.25; }
            100% { opacity: 0;    transform: translateY(0) rotate(0deg); }
        }

        /* Glow radial centré */
        .page-404::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 65%);
            pointer-events: none;
        }

        /* 404 number */
        .error-number {
            font-family: var(--font-display);
            font-size: clamp(6rem, 24vw, 14rem);
            line-height: 1;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.02em;
            position: relative;
            animation: slideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            /* Gold outline ghost */
            -webkit-text-stroke: 1px rgba(201,168,76,0.2);
        }

        .error-number::after {
            content: "404";
            position: absolute;
            inset: 0;
            color: transparent;
            -webkit-text-stroke: 1px rgba(201,168,76,0.12);
            transform: translate(6px, 6px);
            z-index: -1;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Carte flottante */
        .lost-card {
            width: clamp(88px, 26vw, 124px);
            margin: -12px 0 0;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(201,168,76,0.1);
            animation: wobble 3.4s ease-in-out infinite;
            position: relative;
            z-index: 2;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(201,168,76,0.15);
        }
        .lost-card img {
            width: 100%;
            display: block;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(-4deg) translateY(0); }
            50%       { transform: rotate(4deg) translateY(-10px); }
        }

        /* Contenu texte */
        .error-content {
            margin-top: 28px;
            animation: fadeUp 0.7s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-tag {
            display: inline-block;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 2px;
            background: var(--gold);
            color: #0d0d0d;
            margin-bottom: 14px;
        }

        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.1rem, 5vw, 1.8rem);
            color: var(--text);
            margin: 0 0 10px;
            letter-spacing: 0.02em;
        }

        .error-desc {
            font-size: 0.88rem;
            color: var(--text-2);
            line-height: 1.75;
            max-width: 320px;
            margin: 0 auto 28px;
        }

        /* Boutons */
        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            background: var(--gold);
            color: #0d0d0d;
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--gold);
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .btn-home:hover { background: var(--gold-light); border-color: var(--gold-light); }

        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 14px 20px;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            border: 1px solid var(--border-2);
            border-radius: var(--radius-sm);
            transition: border-color var(--transition), color var(--transition);
            cursor: pointer;
        }
        .btn-back:hover { border-color: var(--text-2); color: var(--text); }

        /* Séparateur */
        .error-sep {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 32px auto 0;
            max-width: 240px;
            width: 100%;
            color: var(--text-muted);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: fadeUp 0.8s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .error-sep::before,
        .error-sep::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Liens rapides */
        .error-links {
            display: flex;
            gap: 22px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
            animation: fadeUp 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .error-links a {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: color var(--transition);
        }
        .error-links a:hover { color: var(--gold); }

        @media (max-width: 480px) {
            .page-404 { padding: 28px 6% 48px; }
            .error-actions { flex-direction: column; align-items: stretch; }
            .btn-home, .btn-back { justify-content: center; padding: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><img class="logo" src="./img/star2.png" alt="StarLight TCG" /></a>
        <div class="menu" id="menuBtn">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-overlay-bg" id="menuOverlayBg"></div>
        <nav class="menu-nav">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="products.html">Produits</a></li>
                <li><a href="404.html">CardList</a></li>
            </ul>
        </nav>
    </div>

    <main class="page-404">
<h1 class="error-number">404</h1>

        <div class="lost-card">
            <img src="./cards/Arriere.png" alt="Carte perdue" />
        </div>

        <div class="error-content">
            <span class="error-tag">Carte introuvable</span>
            <h2 class="error-title">Cette page a disparu<br>comme une carte Gold</h2>
            <p class="error-desc">
                La page que vous cherchez n'existe pas, a été déplacée ou n'est plus disponible.
                Aussi rare qu'un God Pack.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-home">← Retour à l'accueil</a>
                <button class="btn-back" onclick="history.back()">Page précédente</button>
            </div>
        </div>

        <div class="error-sep">Explorer</div>
        <nav class="error-links">
            <a href="index.html">Accueil</a>
            <a href="products.html">Produits</a>
            <a href="404.html">CardList</a>
        </nav>

    </main>

    <script src="index.js" defer></script>
</body>
</html>
