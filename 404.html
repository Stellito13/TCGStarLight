<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page introuvable · StarLight</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .page-404 {
            min-height: calc(100vh - 72px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 5%;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Étoiles flottantes */
        .stars-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0;
            animation: floatStar 6s ease-in-out infinite;
            color: #bbb;
        }
        .star:nth-child(1)  { left: 8%;  top: 15%; animation-delay: 0s;    font-size: 1.6rem; }
        .star:nth-child(2)  { left: 20%; top: 70%; animation-delay: 0.8s;  font-size: 0.9rem; }
        .star:nth-child(3)  { left: 35%; top: 20%; animation-delay: 1.4s;  font-size: 1.1rem; }
        .star:nth-child(4)  { left: 55%; top: 80%; animation-delay: 0.3s;  font-size: 1.4rem; }
        .star:nth-child(5)  { left: 70%; top: 12%; animation-delay: 1.9s;  font-size: 0.8rem; }
        .star:nth-child(6)  { left: 82%; top: 55%; animation-delay: 0.6s;  font-size: 1.3rem; }
        .star:nth-child(7)  { left: 90%; top: 30%; animation-delay: 2.2s;  font-size: 1rem;   }
        .star:nth-child(8)  { left: 48%; top: 10%; animation-delay: 1.1s;  font-size: 0.7rem; }
        .star:nth-child(9)  { left: 15%; top: 40%; animation-delay: 2.8s;  font-size: 1.5rem; }
        .star:nth-child(10) { left: 65%; top: 65%; animation-delay: 0.5s;  font-size: 0.9rem; }

        @keyframes floatStar {
            0%   { opacity: 0;    transform: translateY(0) rotate(0deg); }
            20%  { opacity: 0.3; }
            50%  { opacity: 0.15; transform: translateY(-18px) rotate(20deg); }
            80%  { opacity: 0.3; }
            100% { opacity: 0;    transform: translateY(0) rotate(0deg); }
        }

        /* 404 */
        .error-number {
            font-family: "New Rocker", system-ui;
            font-size: clamp(6rem, 26vw, 16rem);
            line-height: 1;
            color: #111;
            margin: 0;
            letter-spacing: -0.02em;
            position: relative;
            animation: slideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .error-number::after {
            content: "404";
            position: absolute;
            inset: 0;
            color: transparent;
            -webkit-text-stroke: 2px #e0e0e0;
            transform: translate(5px, 5px);
            z-index: -1;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Carte flottante */
        .lost-card {
            width: clamp(90px, 28vw, 130px);
            margin: -16px 0 0;
            box-shadow: 0 14px 32px rgba(0,0,0,0.25);
            animation: wobble 3.2s ease-in-out infinite;
            position: relative;
            z-index: 2;
            overflow: hidden;
            flex-shrink: 0;
        }
        .lost-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50%       { transform: rotate(5deg)  translateY(-10px); }
        }

        /* Texte */
        .error-content {
            margin-top: 24px;
            animation: fadeUp 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
            width: 100%;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-title {
            font-family: "New Rocker", system-ui;
            font-size: clamp(1.1rem, 5vw, 1.9rem);
            color: #111;
            margin: 0 0 10px;
        }
        .error-desc {
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            color: #888;
            line-height: 1.75;
            max-width: 300px;
            margin: 0 auto 24px;
        }

        /* Boutons */
        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            background: #111;
            color: #fff;
            font-family: "Outfit", sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid #111;
            border-radius: 4px;
            transition: background 0.18s, color 0.18s;
        }
        .btn-home:hover {
            background: transparent;
            color: #111;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 14px 18px;
            background: transparent;
            color: #888;
            font-family: "Outfit", sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            border: 2px solid #ddd;
            border-radius: 4px;
            transition: border-color 0.18s, color 0.18s;
            cursor: pointer;
        }
        .btn-back:hover {
            border-color: #111;
            color: #111;
        }

        /* Liens rapides */
        .error-sep {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px auto 0;
            max-width: 260px;
            color: #ccc;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            width: 100%;
        }
        .error-sep::before,
        .error-sep::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }
        .error-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 14px;
            flex-wrap: wrap;
            animation: fadeUp 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .error-links a {
            font-size: 0.82rem;
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: color 0.15s;
        }
        .error-links a:hover { color: #111; }

        /* MOBILE */
        @media (max-width: 480px) {
            .page-404 {
                padding: 24px 6%;
                justify-content: center;
                gap: 0;
            }
            .error-number {
                font-size: clamp(5rem, 28vw, 8rem);
            }
            .lost-card {
                width: clamp(80px, 30vw, 110px);
                margin: -10px 0 0;
            }
            .error-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .btn-home, .btn-back {
                justify-content: center;
                padding: 16px;
                font-size: 0.88rem;
            }
            .error-sep {
                margin-top: 22px;
            }
        }

        @media (max-width: 380px) {
            .error-actions { flex-direction: column; align-items: stretch; }
            .btn-home, .btn-back { justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <img class="logo" src="./img/star2.png" alt="StarLight logo" />
        <div class="menu" id="menuBtn">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-overlay-bg" id="menuOverlayBg"></div>
        <nav class="menu-nav">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cardlist.html">CardList</a></li>
            </ul>
        </nav>
    </div>

    <main class="page-404">

        <div class="stars-bg" aria-hidden="true">
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
            <span class="star">✦</span>
        </div>

        <h1 class="error-number">404</h1>

        <div class="lost-card">
            <img src="./cards/Arriere.png" alt="Carte perdue" />
        </div>

        <div class="error-content">
            <h2 class="error-title">Cette carte est introuvable</h2>
            <p class="error-desc">
                La page que vous cherchez a disparu comme une carte rare dans un booster.
                Elle n'existe pas, a été déplacée ou n'est plus disponible.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-home">← Retour à l'accueil</a>
                <button class="btn-back" onclick="history.back()">Page précédente</button>
            </div>
        </div>

        <div class="error-sep">Explorer</div>
        <nav class="error-links">
            <a href="products.html">Products</a>
            <a href="cardlist.html">CardList</a>
            <a href="contact.html">Contact</a>
        </nav>

    </main>

    <script src="index.js" defer></script>

</body>
</html>
