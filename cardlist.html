<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="cardlist.css" />
	<script src="index.js" defer></script>
		<script src="cardlist.js" defer></script>
    <title>Document</title>
</head>
<body>
	<header>

		<img class="logo" src="./img/star2.png" alt="StarLight logo" />

		<div class="menu" id="menuBtn">
			<div></div>
			<div></div>
			<div></div>
		</div>

	</header>

	<!-- ========================= -->
	<!-- MENU OVERLAY -->
	<!-- ========================= -->

	<div class="menu-overlay" id="menuOverlay">
		<div class="menu-overlay-bg" id="menuOverlayBg"></div>
		<nav class="menu-nav">
			<ul>
				<li><a href="index.html">Accueil</a></li>
				<li><a href="products.html">Products</a></li>
				<li><a href="cardlist.html">CardList</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</nav>
	</div>


	    <!-- HERO -->
    <div class="cardlist-hero">
        <h2>CardList</h2>
        <p>New Collection Edition — NCE - FR &nbsp;·&nbsp; <span id="totalCount">4</span> cartes</p>
    </div>
 
    <!-- FILTERS -->
    <div class="filters">
        <span class="filter-label">Rareté :</span>
        <button class="filter-btn active" data-filter="all">Toutes</button>
        <button class="filter-btn rarity-C" data-filter="C">C – Commune</button>
        <button class="filter-btn rarity-R" data-filter="R">R – Rare</button>
        <button class="filter-btn rarity-P" data-filter="P">P – Parallèle</button>
        <button class="filter-btn rarity-G" data-filter="G">G – Gold</button>
    </div>
 
    <!-- SEARCH -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Rechercher une carte…" />
        <span class="card-count" id="cardCount">37 cartes</span>
    </div>
 
    <hr class="section-sep">
 
    <!-- GRID -->
    <div class="cards-grid" id="cardsGrid">
        <!-- Cards injected by JS -->
    </div>
 
    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-bg" id="lightboxBg"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">✕</button>
            <img id="lightboxImg" src="" alt="" />
        </div>
    </div>
</body>
</html>
